<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!--A1S-->
<title>하시캐</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=VT323&display=swap">
<style>
  /* SEGA 게임센터 가이드 일러스트 팔레트 — 민트 / 다크 틸 / 핑크 / 블루 / 옐로 */
  :root{
    --mint:#e9f2f0; --mint-deep:#d7e7e3;
    --ink:#1e3a35; --teal:#235049;
    --blue:#4f7be0; --blue-deep:#3a5fc4;
    --pink:#f6cfd0; --coral:#e8836f; --magenta:#e887a9;
    --yellow:#f3d977; --yellow-deep:#e8c33f;
    --white:#fbfdfc;
    --disp:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --ui:'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--mint);
    color:var(--ink);
    font-family:var(--ui);
    overflow:hidden;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }
  #app{height:100%;height:100dvh;display:flex;flex-direction:column}

  /* ── 마퀴 ── */
  .marquee{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 14px;
    background:var(--white);
    border-bottom:3px solid var(--ink);
  }
  .logo{display:flex;align-items:center;gap:9px;min-width:0}
  .logo .badge{
    width:26px;height:26px;border-radius:50%;
    background:var(--pink);border:2.5px solid var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--disp);font-size:14px;color:var(--ink);flex:0 0 auto;
  }
  .logo .jp{
    font-family:var(--disp);font-size:clamp(17px,4.6vw,23px);line-height:1;
    color:var(--ink);letter-spacing:.5px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }
  .logo .en{
    font-weight:700;font-size:9px;letter-spacing:1.6px;
    color:var(--blue);white-space:nowrap;
  }
  @media (max-width:560px){ .logo .en{display:none} }
  .meters{display:flex;gap:6px;flex:0 0 auto;align-items:center}
  /* 디지털(LED) 카운터 — 실기 크레딧 표시기 */
  .meter{
    background:#0d1512;
    border:2.5px solid var(--ink);
    border-radius:9px;
    padding:2px 9px 3px;
    text-align:center;min-width:58px;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.55);
  }
  .meter .k{font-size:8px;font-weight:700;letter-spacing:1.6px;color:#5e8a7e}
  .meter .v{
    font-family:'VT323',monospace;font-size:23px;line-height:.92;color:#ffd34d;
    text-shadow:0 0 7px rgba(255,190,60,.8);
    font-variant-numeric:tabular-nums;
  }
  .meter.grn .v{color:#7dffb0;text-shadow:0 0 7px rgba(90,255,150,.7)}
  .menubtn{
    width:34px;height:34px;border-radius:9px;
    border:2.5px solid var(--ink);background:var(--yellow);
    font-size:16px;line-height:1;color:var(--ink);cursor:pointer;
    box-shadow:0 2.5px 0 var(--ink);
  }
  .menubtn:active{transform:translateY(2px);box-shadow:none}
  .menu{
    position:absolute;right:10px;top:52px;z-index:25;
    display:none;flex-direction:column;gap:7px;
    background:var(--white);border:3px solid var(--ink);border-radius:14px;
    padding:10px;min-width:150px;
    filter:drop-shadow(0 4px 0 rgba(30,58,53,.2));
  }
  .menu.show{display:flex}
  .mitem{
    font-family:var(--disp);font-size:13px;color:var(--ink);
    background:var(--pink);border:2.5px solid var(--ink);border-radius:10px;
    padding:7px 10px;cursor:pointer;box-shadow:0 2.5px 0 var(--ink);text-align:center;
  }
  .mitem:active{transform:translateY(2px);box-shadow:none}
  .mstat{
    display:flex;justify-content:space-between;align-items:center;
    font-size:10px;font-weight:700;letter-spacing:1px;color:var(--teal);
    background:var(--mint);border:2px solid var(--mint-deep);border-radius:8px;
    padding:4px 9px;
  }
  .mstat b{font-family:var(--disp);font-size:14px;color:var(--blue-deep)}
  .mver{text-align:center;font-size:10px;letter-spacing:.12em;color:var(--teal);opacity:.65}

  /* ── 스테이지 ── */
  .stage{flex:1 1 auto;position:relative;min-height:0}
  canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  .toast{
    position:absolute;left:50%;top:14px;transform:translateX(-50%);
    background:var(--white);
    border:3px solid var(--blue);border-radius:18px;
    padding:9px 16px;
    font-family:var(--disp);font-size:14px;color:var(--ink);
    width:max-content;max-width:86%;text-align:center;line-height:1.45;
    opacity:0;transition:opacity .25s;pointer-events:none;
    filter:drop-shadow(0 3px 0 rgba(30,58,53,.14));
    z-index:5;
  }
  .toast::after{
    content:'';position:absolute;left:50%;bottom:-11px;transform:translateX(-50%) rotate(45deg);
    width:14px;height:14px;background:var(--white);
    border-right:3px solid var(--blue);border-bottom:3px solid var(--blue);
  }
  .toast.show{opacity:1}
  .get{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    pointer-events:none;opacity:0;transition:opacity .2s;z-index:6;
  }
  .get.show{opacity:1}
  .get .plate{
    font-family:var(--disp);
    font-size:clamp(58px,19vw,120px);line-height:1;color:var(--coral);
    -webkit-text-stroke:3px var(--ink);
    text-shadow:4px 5px 0 var(--yellow);
    transform:rotate(-4deg);
  }
  .get .sub{
    font-family:var(--disp);font-size:clamp(14px,4vw,20px);color:var(--ink);
    background:var(--white);border:3px solid var(--blue);border-radius:14px;
    padding:5px 16px;transform:rotate(-4deg);
  }

  /* ── 가챠(새 경품 추첨) 연출 ── */
  .gacha{
    position:fixed;inset:0;z-index:15;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:rgba(30,58,53,.62);
    opacity:0;pointer-events:none;transition:opacity .3s;
    --gcol:#4f7be0;
  }
  .gacha.show{opacity:1;pointer-events:auto}
  .gacha-rays{
    position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;
    transform:translate(-50%,-50%);
    background:repeating-conic-gradient(var(--gcol) 0 9deg, transparent 9deg 22deg);
    opacity:0;border-radius:50%;
    animation:gspin 14s linear infinite;
    transition:opacity .5s;
  }
  .gacha.reveal .gacha-rays{opacity:.28}
  @keyframes gspin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .gacha-wait{
    position:relative;
    font-family:var(--disp);font-size:clamp(18px,5vw,26px);color:var(--white);
    text-shadow:0 3px 0 rgba(30,58,53,.4);
    animation:gpulse 0.8s ease-in-out infinite alternate;
  }
  @keyframes gpulse{from{transform:scale(1)}to{transform:scale(1.12)}}
  .gacha.reveal .gacha-wait{display:none}
  .gacha-card{
    position:relative;
    display:none;flex-direction:column;align-items:center;gap:8px;
    background:var(--white);
    border:4px solid var(--gcol);border-radius:22px;
    padding:16px 26px 18px;
    box-shadow:0 0 0 4px var(--white), 0 0 44px var(--gcol), 0 8px 0 rgba(30,58,53,.35);
  }
  .gacha.reveal .gacha-card{display:flex;animation:gpop .45s cubic-bezier(.2,1.6,.4,1)}
  @keyframes gpop{from{transform:scale(.3) rotate(-7deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
  .gacha-title{
    font-size:10px;font-weight:700;letter-spacing:2.5px;color:var(--teal);opacity:.8;
  }
  .gacha-grade{
    position:absolute;top:-16px;right:-14px;
    font-family:var(--disp);font-size:16px;color:#fff;
    border:3px solid var(--ink);border-radius:12px;padding:3px 12px;
    transform:rotate(7deg);
    box-shadow:0 3px 0 var(--ink);
  }
  .gacha-name{
    font-family:var(--disp);font-size:clamp(17px,4.6vw,22px);color:var(--ink);
  }
  .gacha-tap{
    position:relative;
    font-family:var(--disp);font-size:13px;color:var(--white);opacity:0;
    transition:opacity .4s .5s;
  }
  .gacha.reveal .gacha-tap{opacity:.9}

  /* ── 컬렉션 모달 ── */
  .modal{
    position:fixed;inset:0;background:rgba(30,58,53,.45);
    display:none;align-items:center;justify-content:center;z-index:20;
    padding:18px;
  }
  .modal.show{display:flex}
  .panel{
    background:var(--white);border:3px solid var(--ink);border-radius:18px;
    width:min(520px,100%);max-height:82vh;display:flex;flex-direction:column;
    overflow:hidden;
  }
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;border-bottom:3px solid var(--ink);
    background:var(--pink);
  }
  .panel-head h2{font-family:var(--disp);font-size:19px;color:var(--ink);font-weight:400}
  .panel-head .cnt{font-family:var(--disp);font-size:14px;color:var(--teal)}
  .panel-close{
    font-family:var(--disp);font-size:14px;color:var(--ink);
    background:var(--yellow);border:2.5px solid var(--ink);border-radius:10px;
    padding:4px 12px;cursor:pointer;box-shadow:0 2px 0 var(--ink);
  }
  .panel-close:active{transform:translateY(2px);box-shadow:none}
  /* 3D 전시실 오버레이 바 (씬은 메인 캔버스에 렌더) */
  .roombar{
    position:fixed;inset:0;z-index:9;display:none;
    flex-direction:column;justify-content:space-between;
    pointer-events:none;
  }
  body.room .marquee,body.room .deck{visibility:hidden}
  .roombar.show{display:flex}
  .rb-top{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 14px;background:var(--white);border-bottom:3px solid var(--ink);
    pointer-events:auto;
  }
  .rb-title{font-family:var(--disp);font-size:19px;color:var(--ink)}
  .rb-cnt{font-family:var(--disp);font-size:14px;color:var(--teal)}
  .rb-bottom{
    background:var(--white);border-top:3px solid var(--ink);
    padding:9px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:7px;pointer-events:auto;
  }
  .rb-set{display:flex;gap:8px}
  .rb-set .chipbtn{flex:1}
  .rb-odds{
    font-size:10.5px;font-weight:700;color:var(--teal);text-align:center;letter-spacing:.3px;
  }
  .colset{
    display:flex;gap:8px;padding:10px 14px 4px;background:var(--mint);
    border-top:2.5px solid var(--ink);
  }
  .colset .chipbtn{width:auto;flex:1}
  .odds{
    padding:4px 14px 12px;background:var(--mint);
    font-size:10.5px;font-weight:700;color:var(--teal);text-align:center;letter-spacing:.3px;
  }

  /* ── 물리 튜닝 (개발용) ── */
  .mitem.dev{background:var(--mint-deep);font-size:12px}
  .devtag{
    font-family:var(--ui);font-size:9px;font-weight:700;letter-spacing:1px;
    background:var(--ink);color:var(--yellow);border-radius:5px;padding:2px 5px;
    vertical-align:middle;margin-left:5px;
  }
  .panel.physpanel{width:min(560px,100%);max-height:88vh}
  .phystop{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    padding:9px 12px;background:var(--mint);border-bottom:2.5px solid var(--ink);
  }
  .ptlab{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--teal)}
  .ptbtn{
    font-family:var(--ui);font-size:11px;font-weight:700;
    color:var(--ink);background:var(--white);
    border:2px solid var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;
  }
  .ptbtn.on{background:var(--blue);color:#fff}
  .ptbtn.act{background:var(--yellow);margin-left:auto}
  .ptbtn.act + .ptbtn.act{margin-left:0}
  .physbody{overflow-y:auto;background:var(--white);padding:4px 12px 10px}
  .physgrp{
    font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--teal);
    padding:11px 0 5px;border-bottom:1.5px dashed var(--mint-deep);margin-bottom:7px;
  }
  .physrow{padding:5px 0 8px}
  .physlab{display:flex;flex-direction:column;gap:1px;margin-bottom:3px}
  .physlab b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--ink)}
  .physlab span{font-size:10px;color:var(--teal);line-height:1.35}
  .physline{display:flex;align-items:center;gap:9px}
  .physline input[type=range]{flex:1;accent-color:var(--blue);min-width:0}
  .physval{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
    color:var(--blue-deep);min-width:64px;text-align:right;font-variant-numeric:tabular-nums;
  }
  .physnote{
    padding:8px 12px 12px;background:var(--mint);border-top:2.5px solid var(--ink);
    font-size:10px;font-weight:700;color:var(--teal);text-align:center;
  }

  /* ── 업그레이드 트리 ── */
  .upwrap{
    background:var(--mint);padding:10px;display:flex;justify-content:center;
    overflow:hidden;
  }
  #upSvg{width:min(360px,88vw);height:auto;user-select:none}
  #upSvg text{font-family:var(--ui)}
  .updesc{
    padding:9px 14px 13px;background:var(--mint);border-top:2.5px solid var(--ink);
    font-size:11.5px;font-weight:700;color:var(--teal);text-align:center;
    min-height:40px;line-height:1.45;
  }

  /* ── 컨트롤 데크 ── */
  .deck{
    flex:0 0 auto;
    background:var(--white);
    border-top:3px solid var(--ink);
    padding:8px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:7px;
  }
  .btnrow{display:flex;align-items:center;justify-content:center;gap:16px}
  .abtn{
    width:86px;height:86px;border-radius:50%;
    flex:0 0 auto;aspect-ratio:1/1;padding:0;
    border:3px solid var(--ink);
    background:linear-gradient(180deg,#6b92ea 0%,var(--blue) 55%,var(--blue-deep) 100%);
    box-shadow:0 5px 0 var(--ink);
    color:var(--white);
    font-family:var(--disp);font-size:15px;line-height:1.15;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    cursor:pointer;touch-action:none;
    transition:transform .06s, box-shadow .06s, filter .15s;
  }
  .abtn .arrow{font-size:22px;line-height:1}
  .abtn:disabled{filter:grayscale(.9) brightness(1.12);color:#8aa0a9;cursor:default}
  .abtn.pressed{
    transform:translateY(4px);
    box-shadow:0 1px 0 var(--ink);
    background:linear-gradient(180deg,var(--blue) 0%,var(--blue-deep) 100%);
  }
  .side{display:flex;flex-direction:column;gap:5px;align-items:center;width:86px}
  .chipbtn{
    font-family:var(--disp);font-size:11px;letter-spacing:.3px;
    color:var(--ink);background:var(--yellow);
    border:2.5px solid var(--ink);border-radius:10px;
    padding:5px 6px;cursor:pointer;width:100%;
    box-shadow:0 3px 0 var(--ink);
    transition:transform .06s, box-shadow .06s;
  }
  .chipbtn.alt{background:var(--pink)}
  .chipbtn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  .chipbtn:disabled{filter:grayscale(.6) brightness(1.05);cursor:default;color:#7d8f8a}
  .coin{
    font-size:10px;font-weight:700;color:var(--teal);opacity:.8;letter-spacing:.5px;text-align:center;
    font-variant-numeric:tabular-nums;
  }
  /* 코인 투입 슬롯 — 실기 결제 패널 (LED 디지털) */
  .side.slot{
    gap:4px;
    background:#0d1512;border:2.5px solid var(--ink);border-radius:12px;
    padding:7px 6px 8px;width:106px;
    box-shadow:inset 0 2px 7px rgba(0,0,0,.6);
  }
  .slotlab{
    font-size:8px;font-weight:700;letter-spacing:2px;color:#5e8a7e;
    display:flex;align-items:center;gap:5px;
  }
  .slotlab::before{
    content:'';width:15px;height:4px;border-radius:2px;
    background:#020604;border:1px solid #2e544a;
    box-shadow:0 0 5px rgba(125,255,176,.35);
  }
  .buybtn{
    white-space:nowrap;
    font-family:'VT323',monospace;
    background:linear-gradient(180deg,#152722 0%,#0f1d18 100%);
    border:2px solid #2e544a;border-radius:9px;
    padding:2px 5px 3px;cursor:pointer;width:100%;
    box-shadow:inset 0 0 10px rgba(90,255,150,.07), inset 0 -6px 10px rgba(0,0,0,.35), 0 2px 0 #04120d;
    display:flex;align-items:center;justify-content:center;gap:7px;
    transition:transform .06s, box-shadow .06s, filter .1s;
  }
  .buybtn b{ /* 코인 (앰버) */
    font-weight:400;font-size:21px;line-height:1;color:#ffd34d;
    text-shadow:0 0 7px rgba(255,190,60,.65);min-width:22px;text-align:right;
  }
  .buybtn i{font-style:normal;font-size:12px;color:#3f6a5d;line-height:1}
  .buybtn em{ /* 게임 (그린) */
    font-style:normal;font-size:21px;line-height:1;color:#7dffb0;
    text-shadow:0 0 7px rgba(90,255,150,.65);min-width:20px;text-align:left;
  }
  .buybtn:active{transform:translateY(2px);box-shadow:inset 0 0 14px rgba(90,255,150,.25);filter:brightness(1.35)}
  .slotkey{
    font-size:8px;font-weight:700;letter-spacing:1.5px;text-align:center;
    color:#3f6a5d;
  }
  .slotkey{display:flex;align-items:center;justify-content:center;gap:4px}
  .abtn:focus-visible,.chipbtn:focus-visible,.panel-close:focus-visible{outline:3px solid var(--yellow-deep);outline-offset:2px}
  @media (max-height:560px){
    .abtn{width:66px;height:66px;font-size:13px}
    .abtn .arrow{font-size:17px}
  }
  @media (prefers-reduced-motion:reduce){
    .abtn,.toast,.get,.chipbtn{transition:none}
  }
.starrow {
  position: absolute; top: 46%; transform: translateY(-50%);
  display: none; flex-direction: column; align-items: center; gap: 2px;
  width: 54px; height: 62px; border: none; border-radius: 14px;
  background: rgba(20, 42, 38, .55); color: #fbfdfc; cursor: pointer;
  -webkit-tap-highlight-color: transparent; backdrop-filter: blur(2px);
  animation: saPulse 1.6s ease-in-out infinite;
}
.starrow.right { right: 8px; }
.starrow.left { left: 8px; }
.starrow .sa-tri { font-size: 22px; line-height: 1; }
.starrow .sa-cap { font-size: 10px; opacity: .85; letter-spacing: .04em; }
.starrow:active { background: rgba(20, 42, 38, .8); }
@keyframes saPulse { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
</style>
<!--A1E-->
</head>
<body>
<!--A2S-->
<div id="app">
  <header class="marquee">
    <div class="logo">
      <div class="badge">★</div>
      <span class="jp">하시캐</span>
      <span class="en">CLENA STYLE</span>
    </div>
    <div class="meters">
      <div class="meter"><div class="k">COIN</div><div class="v" id="mCoin">30</div></div>
      <div class="meter grn"><div class="k">PLAY</div><div class="v" id="mPlay">00</div></div>
      <button class="menubtn" id="bMenu" aria-label="메뉴" aria-haspopup="true">☰</button>
    </div>
  </header>

  <div class="menu" id="menuPop">
    <button class="mitem" id="bUp">업그레이드</button>
    <button class="mitem" id="bHelp">공략 보기</button>
    <button class="mitem" id="bCol">컬렉션</button>
    <button class="mitem" id="bSnd">BGM: 온</button>
    <button class="mitem dev" id="bPhys">물리 튜닝 (DEV)</button>
    <div class="mstat"><span>GET</span><b id="mGet">0</b></div>
    <div class="mver" id="mVer">v25</div>
  </div>

  <div class="stage">
    <canvas id="gl" aria-label="크레인 게임 화면 — 드래그하면 시점이 회전합니다"></canvas>
    <div class="toast" id="toast" role="status"></div>
    <button class="starrow right" id="stR" aria-label="우측 기계로 이동" style="display:none">
      <span class="sa-tri">▶</span><span class="sa-cap">옆 기계</span>
    </button>
