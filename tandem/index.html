<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f5">
  <meta name="description" content="Tandem — period & cycle tracking built for couples. One cycle, two people in the loop.">
  <title>Tandem — cycle tracking for two</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">

    <header class="top-bar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 21s-7.5-4.7-9.6-9C.9 8.9 2.7 5.5 6 5.5c2 0 3.2 1 4 2.2.8-1.2 2-2.2 4-2.2 3.3 0 5.1 3.4 3.6 6.5-2.1 4.3-9.6 9-9.6 9z" fill="#ff385c"/>
          <path d="M6.2 5.9C4.6 4.6 3 5 2.4 6.2M17.8 5.9c1.6-1.3 3.2-.9 3.8.3" stroke="#c81e48" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="2.6" cy="7.1" r="1.5" fill="#ff8fa9"/><circle cx="21.4" cy="7.1" r="1.5" fill="#ff8fa9"/>
        </svg>
        <span class="brand-name">Tan<em>dem</em></span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" data-action="paywall" aria-label="Tandem Plus">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"/></svg>
        </button>
        <button class="icon-btn" data-action="open-settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
        </button>
      </div>
    </header>

    <main>
      <section class="panel" id="panel-home" aria-label="Home"></section>
      <section class="panel" id="panel-calendar" aria-label="Calendar"></section>
      <section class="panel" id="panel-log" aria-label="Daily log"></section>
      <section class="panel" id="panel-insights" aria-label="Insights"></section>
      <section class="panel" id="panel-partner" aria-label="Partner"></section>
    </main>

    <nav class="tab-bar" aria-label="Main tabs">
      <button data-tab="home" class="on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        <span data-i18n="tab.home">Home</span>
      </button>
      <button data-tab="calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        <span data-i18n="tab.calendar">Calendar</span>
      </button>
      <button data-tab="log" class="tab-orb" aria-label="Daily log">
        <span class="orb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </span>
      </button>
      <button data-tab="insights">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-6M21 20H3"/></svg>
        <span data-i18n="tab.insights">Insights</span>
      </button>
      <button data-tab="partner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7.5-4.7-9.6-9C.9 8.9 2.7 5.5 6 5.5c2 0 3.2 1 4 2.2.8-1.2 2-2.2 4-2.2 3.3 0 5.1 3.4 3.6 6.5-2.1 4.3-9.6 9-9.6 9z"/></svg>
        <span data-i18n="tab.partner">Partner</span>
      </button>
    </nav>

    <!-- Sheets / modals -->
    <div class="scrim" id="onboard"><div class="sheet"><div class="sheet-grab"></div><div id="onboard-body"></div></div></div>
    <div class="scrim" id="settings"><div class="sheet"><div class="sheet-grab"></div><div id="settings-body"></div></div></div>
    <div class="scrim" id="paywall"><div class="sheet"><div class="sheet-grab"></div><div id="paywall-body"></div></div></div>
    <div class="scrim" id="day-sheet"><div class="sheet"><div class="sheet-grab"></div><div id="day-sheet-body"></div></div></div>
    <div class="scrim" id="sheetviewer"><div class="sheet"><div class="sheet-grab"></div><div id="sheet-view"></div></div></div>

    <div id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="js/cycle.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sprite.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
