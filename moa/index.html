<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Moa — shared photo albums stored in your private GitHub repositories.">
  <title>Moa — shared albums</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Moa">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="vendor/pretendard/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">

    <!-- first run / add a repository -->
    <section id="welcome" class="welcome" hidden></section>

    <div id="shell" hidden>
      <header class="bar">
        <button class="space-btn" id="spaceBtn" data-i18n-aria="aria.switchAlbum" aria-label="Switch album">
          <span class="logo" aria-hidden="true"></span>
          <span id="spaceName">Moa</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="bar-actions">
          <span class="sync" id="sync" hidden></span>
          <button class="icon-btn" id="searchBtn" data-i18n-aria="aria.search" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
          <button class="text-btn" id="selectBtn">Select</button>
          <button class="btn btn-primary btn-sm" id="uploadBtn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="up.go">Upload</span></button>
        </div>
      </header>

      <main id="main">
        <section class="tab" id="tab-photos">
          <div class="hero" id="hero"></div>
          <div class="toolbar" id="toolbar">
            <div class="search-row" id="searchRow" hidden>
              <input type="search" id="searchInput" data-i18n-ph="search.ph" placeholder="Search" autocomplete="off" enterkeyhint="search">
            </div>
            <div class="seg" id="viewSeg" role="tablist">
              <span class="seg-thumb" id="segThumb" aria-hidden="true"></span>
              <button data-view="date" role="tab" data-i18n="view.date">Date</button>
              <button data-view="place" role="tab" data-i18n="view.place">Places</button>
              <button data-view="map" role="tab" data-i18n="view.map">Map</button>
              <button data-view="tag" role="tab" data-i18n="view.tag">Tags</button>
            </div>
            <div class="controls" id="controls"></div>
            <div class="chips" id="chips"></div>
          </div>
          <div id="content" class="content"></div>
        </section>

        <section class="tab" id="tab-albums" hidden></section>
        <section class="tab" id="tab-settings" hidden></section>
      </main>

      <nav class="tabbar" id="tabbar">
        <div class="tabs">
        <span class="tab-thumb" id="tabThumb" aria-hidden="true"></span>
        <button data-tab="photos" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg><span data-i18n="tab.library">Library</span></button>
        <button data-tab="albums"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="6" width="15" height="15" rx="2.5"/><path d="M7 3h11.5A2.5 2.5 0 0 1 21 5.5V17"/></svg><span data-i18n="tab.albums">Albums</span></button>
        <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.6"/><path d="M17.5 14.3c2.3.2 3.7 1.8 4 4.2"/></svg><span data-i18n="tab.settings">Settings</span></button>
        </div>
        <button class="fab" id="uploadFab" data-i18n-aria="up.go" aria-label="Upload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </nav>

      <div class="select-bar" id="selectBar" hidden>
        <span id="selCount"></span>
        <div>
          <button class="text-btn" data-sel="tag" data-i18n="view.tag">Tags</button>
          <button class="text-btn" data-sel="album" data-i18n="pick.title">Add to album</button>
          <button class="text-btn danger" data-sel="delete" data-i18n="common.delete">Delete</button>
        </div>
      </div>
    </div>

    <!-- full-screen photo viewer -->
    <div class="viewer" id="viewer" hidden>
      <div class="v-backdrop" id="vBackdrop"></div>
      <div class="v-top">
        <button class="v-btn" data-v="close" data-i18n-aria="aria.close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 5-7 7 7 7"/></svg></button>
        <div class="v-title"><b id="vDate"></b><span id="vSub"></span></div>
        <button class="v-btn" data-v="info" data-i18n-aria="info.details" aria-label="Details"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></button>
      </div>
      <div class="v-stage" id="vStage">
        <div class="v-media" id="vMedia">
          <img id="vImg" alt="" draggable="false">
          <video id="vLive" playsinline muted preload="auto" disablepictureinpicture></video>
          <video id="vVideo" playsinline controls preload="metadata" hidden></video>
          <div class="v-spinner" id="vSpin"></div>
        </div>
        <button class="live-pill" id="livePill" hidden data-i18n-aria="aria.playLive" aria-label="Play Live Photo">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.2"/><circle cx="12" cy="12" r="9.4" stroke-dasharray="1.2 2.4"/></svg>LIVE
        </button>
        <button class="v-nav prev" data-v="prev" data-i18n-aria="aria.prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 5-7 7 7 7"/></svg></button>
        <button class="v-nav next" data-v="next" data-i18n-aria="aria.next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg></button>
      </div>
      <div class="v-bottom">
        <button class="v-act" data-v="like" id="vLike"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.5 8 3.3 4.5 6.7 4.5c2.1 0 3.4 1.1 4.3 2.4.9-1.3 2.2-2.4 4.3-2.4 3.4 0 5.2 3.5 4 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg><span></span></button>
        <button class="v-act" data-v="comments" id="vCmt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg><span></span></button>
        <div class="v-tags" id="vTags"></div>
        <button class="v-act" data-v="download" data-i18n-aria="info.dlOriginal" aria-label="Download original"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg></button>
      </div>
      <aside class="v-info" id="vInfo" hidden></aside>
    </div>

    <div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="up-pill" id="upPill" hidden></div>
    <input type="file" id="fileInput" multiple accept="image/*,video/*,.heic,.heif,.mov,.mp4" hidden>
  </div>

  <script src="vendor/exifr.umd.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/qrcode/qrcode.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
