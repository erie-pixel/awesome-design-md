<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f5">
  <meta name="description" content="Tandem — period & cycle tracking built for couples. One cycle, two people in the loop.">
  <title>Tandem — cycle tracking for two</title>
  <style>
/* ============================================================
   Tandem — cycle tracking for two
   Design tokens blended from two DESIGN.md sources in this repo:
   - design-md/airbnb/DESIGN.md  (Rausch #ff385c voltage, pill
     shapes, soft 14px cards, single shadow tier, 8px buttons)
   - design-md/claude/DESIGN.md  (warm cream canvas #faf9f5,
     serif display headlines, editorial pacing, teal/amber accents)
   ============================================================ */

:root {
  /* Canvas & surfaces — Claude DESIGN.md */
  --canvas: #faf9f5;
  --surface-soft: #f5f0e8;
  --surface-card: #efe9de;
  --surface-strong: #e8e0d2;
  --surface-dark: #181715;
  --surface-dark-elev: #252320;

  /* Ink — Claude DESIGN.md */
  --ink: #141413;
  --body: #3d3d3a;
  --muted: #6c6a64;
  --muted-soft: #8e8b82;
  --on-dark: #faf9f5;
  --on-dark-soft: #a09d96;

  /* Voltage — Airbnb DESIGN.md (Rausch) */
  --primary: #ff385c;
  --primary-active: #e00b41;
  --primary-disabled: #ffd1da;
  --primary-soft: #fff0f3;

  /* Companions — Claude DESIGN.md accents */
  --coral: #cc785c;
  --teal: #5db8a6;
  --teal-soft: #e3f2ee;
  --amber: #e8a55a;
  --amber-soft: #faeeda;
  --success: #5db872;
  --error: #c64545;

  /* Hairlines */
  --hairline: #e6dfd8;
  --hairline-soft: #ebe6df;

  /* Radius — Airbnb scale */
  --r-xs: 4px;
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 32px;
  --r-pill: 9999px;

  /* The single Airbnb shadow tier */
  --shadow: rgba(0,0,0,0.02) 0 0 0 1px, rgba(0,0,0,0.04) 0 2px 6px, rgba(0,0,0,0.10) 0 4px 8px;
  --shadow-nav: 0 -1px 0 var(--hairline), rgba(0,0,0,0.05) 0 -4px 16px;

  /* Type — Claude editorial split (open substitutes per DESIGN.md) */
  --serif: "Copernicus", "Tiempos Headline", Georgia, "Times New Roman", serif;
  --sans: "Airbnb Cereal VF", "StyreneB", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  /* Motion — transform/opacity only, standard + spring easings */
  --ease: cubic-bezier(.2,.8,.2,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
  --t-fast: 160ms;
  --t-med: 260ms;
  --t-slow: 420ms;

  --nav-h: 68px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { height: 100%; }
body {
  min-height: 100%;
  background: var(--surface-soft);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; font-size: inherit; border: 0; background: none; color: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 16px; color: var(--ink); }
::selection { background: var(--primary-disabled); }

/* ---------- App shell: phone-frame column, mobile-first ---------- */
#app {
  position: relative;
  max-width: 520px;
  margin: 0 auto;
  min-height: 100dvh;
  background: var(--canvas);
  display: flex;
  flex-direction: column;
}
@media (min-width: 560px) {
  #app { box-shadow: var(--shadow); border-left: 1px solid var(--hairline); border-right: 1px solid var(--hairline); }
}

/* ---------- Header ---------- */
.top-bar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  height: 60px; padding: 0 16px;
  background: color-mix(in srgb, var(--canvas) 88%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--hairline-soft);
}
.brand { display: flex; align-items: center; gap: 8px; }
.brand-mark { width: 26px; height: 26px; }
.brand-name { font-family: var(--serif); font-size: 21px; letter-spacing: -0.3px; }
.brand-name em { font-style: normal; color: var(--primary); }
.top-actions { display: flex; gap: 6px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: var(--r-pill);
  display: grid; place-items: center;
  background: var(--surface-soft); color: var(--ink);
  transition: transform var(--t-fast) var(--spring), background var(--t-fast) var(--ease);
}
.icon-btn:active { transform: scale(.92); background: var(--surface-strong); }
.icon-btn svg { width: 19px; height: 19px; }

/* ---------- Panels & tab transitions ---------- */
main { flex: 1; padding-bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom)); }
.panel { display: none; padding: 20px 16px 8px; }
.panel.active { display: block; animation: panel-in var(--t-med) var(--ease) both; }
@keyframes panel-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}
/* Staggered card entrance — index set via --i */
.panel.active .stagger { animation: rise var(--t-slow) var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: none; }
}

/* ---------- Typography ---------- */
h1.display { font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1.12; letter-spacing: -0.6px; }
h2.section-title { font-family: var(--serif); font-weight: 400; font-size: 22px; letter-spacing: -0.3px; margin: 26px 0 12px; }
h2.section-title:first-child { margin-top: 0; }
.sub { color: var(--muted); font-size: 14px; line-height: 1.45; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); }

/* ---------- Cards ---------- */
.card {
  background: #fff;
  border: 1px solid var(--hairline);
  border-radius: var(--r-md);
  padding: 18px;
  margin-bottom: 14px;
}
.card.cream { background: var(--surface-card); border-color: transparent; }
.card.soft { background: var(--surface-soft); border-color: transparent; }
.card.dark { background: var(--surface-dark); border-color: transparent; color: var(--on-dark); }
.card.dark .sub { color: var(--on-dark-soft); }
.card.voltage { background: var(--primary); border-color: transparent; color: #fff; }
.card.voltage .sub { color: rgba(255,255,255,.85); }
.card-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* ---------- Buttons — Airbnb DESIGN.md ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 500; font-size: 16px; line-height: 1.25;
  border-radius: var(--r-sm);
  padding: 13px 24px; min-height: 48px;
  transition: transform var(--t-fast) var(--spring), background var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
  user-select: none;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:active { background: var(--primary-active); }
.btn-secondary { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.btn-ghost { background: var(--surface-soft); color: var(--ink); }
.btn-pill { border-radius: var(--r-pill); padding: 10px 20px; min-height: 40px; font-size: 14px; }
.btn-block { width: 100%; }
.btn-on-voltage { background: #fff; color: var(--primary); }
.btn-on-dark { background: var(--surface-dark-elev); color: var(--on-dark); }
.btn[disabled] { background: var(--primary-disabled); cursor: not-allowed; }

/* ---------- Chips (symptoms, moods, flow) ---------- */
.chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border-radius: var(--r-pill);
  padding: 9px 15px;
  background: var(--surface-soft);
  color: var(--body);
  font-size: 14px; font-weight: 500;
  border: 1px solid transparent;
  transition: transform var(--t-fast) var(--spring), background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.chip:active { transform: scale(.94); }
.chip.on { background: var(--ink); color: var(--on-dark); }
.chip.on-voltage { background: var(--primary); color: #fff; }
.chip .emo { margin-right: 5px; }

/* ---------- Badges ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase;
  border-radius: var(--r-pill); padding: 3px 10px;
}
.badge-plus { background: var(--surface-dark); color: var(--amber); }
.badge-soft { background: var(--surface-card); color: var(--body); }
.badge-teal { background: var(--teal-soft); color: #2f7d6d; }
.badge-voltage { background: var(--primary-soft); color: var(--primary-active); }

/* ---------- Home / hero ---------- */
.hero { text-align: center; padding-top: 8px; }
.womb-stage { position: relative; width: 264px; height: 264px; margin: 6px auto 2px; }
#womb-canvas { width: 100%; height: 100%; display: block; }
.womb-halo {
  position: absolute; inset: 14px; border-radius: 50%;
  background: radial-gradient(circle, var(--primary-soft) 0%, transparent 68%);
  z-index: -1;
  animation: halo 4.4s var(--ease) infinite;
}
@keyframes halo { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.07); opacity: 1; } }
.cycle-day-pill {
  position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%);
  background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-pill);
  box-shadow: var(--shadow);
  padding: 7px 16px; font-size: 13px; font-weight: 600; white-space: nowrap;
}
.phase-line { font-family: var(--serif); font-size: 28px; letter-spacing: -0.4px; margin-top: 14px; }
.count-line { color: var(--muted); font-size: 15px; margin-top: 4px; }
.count-line strong { color: var(--ink); }
.quick-row { display: flex; gap: 10px; justify-content: center; margin: 18px 0 6px; }

/* phase mini legend on home */
.phase-track { display: flex; gap: 4px; margin: 20px 4px 6px; }
.phase-track span { height: 6px; border-radius: 3px; flex: 1; background: var(--surface-strong); position: relative; overflow: hidden; }
.phase-track span.fill-p { background: var(--primary); }
.phase-track span.fill-f { background: var(--amber); }
.phase-track span.fill-o { background: var(--teal); }
.phase-track span.fill-l { background: var(--coral); }
.phase-track-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted-soft); padding: 0 4px; }

/* ---------- Calendar ---------- */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-title { font-family: var(--serif); font-size: 22px; letter-spacing: -0.3px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-size: 11px; font-weight: 600; color: var(--muted-soft); padding: 6px 0; text-transform: uppercase; letter-spacing: .5px; }
.cal-day {
  position: relative; aspect-ratio: 1; border-radius: var(--r-pill);
  display: grid; place-items: center; font-size: 14px; color: var(--body);
  transition: transform var(--t-fast) var(--spring), background var(--t-fast) var(--ease);
  background: transparent;
}
.cal-day:active { transform: scale(.9); }
.cal-day.dim { color: var(--hairline); pointer-events: none; }
.cal-day.today { box-shadow: inset 0 0 0 2px var(--ink); font-weight: 700; }
.cal-day.period { background: var(--primary); color: #fff; font-weight: 600; }
.cal-day.predicted { box-shadow: inset 0 0 0 1.5px var(--primary); color: var(--primary-active); background: var(--primary-soft); }
.cal-day.fertile { background: var(--teal-soft); color: #2f7d6d; }
.cal-day.ovulation { background: var(--teal); color: #fff; font-weight: 700; }
.cal-day.pms { background: var(--amber-soft); color: #9a6a25; }
.cal-day.today.period { box-shadow: inset 0 0 0 2px var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; font-size: 12px; color: var(--muted); }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: -1px; }

/* ---------- Log ---------- */
.log-date-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.log-date-strip::-webkit-scrollbar { display: none; }
.date-cell {
  flex: 0 0 auto; width: 52px; padding: 8px 0; text-align: center;
  border-radius: var(--r-md); background: var(--surface-soft);
  transition: background var(--t-fast) var(--ease), transform var(--t-fast) var(--spring);
}
.date-cell:active { transform: scale(.93); }
.date-cell .dw { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
.date-cell .dn { font-size: 17px; font-weight: 600; }
.date-cell.sel { background: var(--ink); color: var(--on-dark); }
.date-cell.sel .dw { color: var(--on-dark-soft); }
.field-label { font-size: 13px; font-weight: 600; color: var(--muted); margin: 16px 0 8px; display: flex; align-items: center; gap: 8px; }
.stepper { display: inline-flex; align-items: center; gap: 14px; background: var(--surface-soft); border-radius: var(--r-pill); padding: 6px 10px; }
.stepper button { width: 30px; height: 30px; border-radius: 50%; background: #fff; box-shadow: var(--shadow); font-size: 17px; font-weight: 700; transition: transform var(--t-fast) var(--spring); }
.stepper button:active { transform: scale(.85); }
.stepper .val { min-width: 56px; text-align: center; font-weight: 600; font-size: 14px; }
textarea.notes {
  width: 100%; min-height: 74px; resize: vertical;
  background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-sm);
  padding: 12px 14px;
  transition: border-color var(--t-fast) var(--ease);
}
textarea.notes:focus, input.text:focus { outline: none; border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

/* ---------- Insights ---------- */
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat-tile { background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 14px 12px; text-align: center; }
.stat-tile .big { font-family: var(--serif); font-size: 30px; letter-spacing: -0.8px; line-height: 1.1; }
.stat-tile .big small { font-size: 14px; letter-spacing: 0; color: var(--muted); font-family: var(--sans); }
.stat-tile .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .6px; font-weight: 600; }
.chart-wrap { overflow-x: auto; }
.bar-chart { display: flex; align-items: flex-end; gap: 10px; height: 130px; padding-top: 8px; }
.bar-col { flex: 1; min-width: 34px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.bar-col .bar { width: 100%; border-radius: 7px 7px 3px 3px; background: linear-gradient(180deg, var(--primary), var(--coral)); transform-origin: bottom; animation: grow var(--t-slow) var(--ease) both; animation-delay: calc(var(--i,0) * 60ms); position: relative; }
.bar-col .bar.avg-line::after { content:""; position: absolute; inset: auto 0 0 0; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.bar-col .v { font-size: 12px; font-weight: 600; }
.bar-col .d { font-size: 10px; color: var(--muted-soft); }
.freq-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.freq-row .name { flex: 0 0 108px; font-size: 13px; }
.freq-row .track { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-soft); overflow: hidden; }
.freq-row .fill { height: 100%; border-radius: 4px; background: var(--primary); transform-origin: left; animation: growx var(--t-slow) var(--ease) both; animation-delay: calc(var(--i,0) * 50ms); }
.freq-row .n { font-size: 12px; color: var(--muted); min-width: 26px; text-align: right; }
@keyframes growx { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* ---------- Lock overlay for premium ---------- */
.locked { position: relative; overflow: hidden; border-radius: var(--r-md); }
.locked > .lock-scrim {
  position: absolute; inset: 0; z-index: 2;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: color-mix(in srgb, var(--canvas) 62%, transparent);
  backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
  border-radius: inherit; text-align: center; padding: 16px;
}
.lock-scrim .t { font-weight: 600; font-size: 14px; }

/* ---------- Partner ---------- */
.role-switch { display: flex; background: var(--surface-soft); border-radius: var(--r-pill); padding: 4px; margin-bottom: 16px; }
.role-switch button { flex: 1; border-radius: var(--r-pill); padding: 9px 0; font-size: 14px; font-weight: 600; color: var(--muted); transition: color var(--t-fast) var(--ease), background var(--t-med) var(--ease), box-shadow var(--t-med) var(--ease); }
.role-switch button.on { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
.note-bubble { max-width: 82%; padding: 10px 14px; border-radius: var(--r-lg); margin-bottom: 8px; font-size: 14px; line-height: 1.4; animation: rise var(--t-med) var(--ease) both; }
.note-bubble.me { margin-left: auto; background: var(--primary); color: #fff; border-bottom-right-radius: 6px; }
.note-bubble.them { background: var(--surface-card); border-bottom-left-radius: 6px; }
.note-bubble .who { display: block; font-size: 10px; opacity: .7; margin-top: 3px; }
.note-compose { display: flex; gap: 8px; margin-top: 10px; }
.note-compose input { flex: 1; border: 1px solid var(--hairline); border-radius: var(--r-pill); padding: 11px 16px; background: #fff; }
.note-compose input:focus { outline: none; border-color: var(--ink); }
.send-orb { width: 46px; height: 46px; flex: 0 0 46px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; transition: transform var(--t-fast) var(--spring), background var(--t-fast) var(--ease); }
.send-orb:active { transform: scale(.88); background: var(--primary-active); }
.tip-list { list-style: none; }
.tip-list li { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--hairline-soft); font-size: 14px; }
.tip-list li:last-child { border-bottom: 0; }
.tip-list .ico { flex: 0 0 auto; }
.code-box { font-family: "JetBrains Mono", ui-monospace, monospace; letter-spacing: 4px; font-size: 22px; text-align: center; background: var(--surface-soft); border-radius: var(--r-sm); padding: 14px; margin: 10px 0; }

/* ---------- Bottom tab bar ---------- */
.tab-bar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 520px; height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: color-mix(in srgb, var(--canvas) 92%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--shadow-nav);
  display: flex; align-items: stretch; z-index: 40;
}
.tab-bar button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; font-weight: 600; color: var(--muted); transition: color var(--t-fast) var(--ease); position: relative; }
.tab-bar button svg { width: 22px; height: 22px; transition: transform var(--t-med) var(--spring); }
.tab-bar button.on { color: var(--primary); }
.tab-bar button.on svg { transform: translateY(-2px) scale(1.08); }
/* Center log orb — Airbnb search-orb pattern */
.tab-orb { flex: 0 0 76px !important; }
.tab-orb .orb {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--primary); color: #fff;
  display: grid; place-items: center;
  margin-top: -20px;
  box-shadow: var(--shadow), 0 6px 16px rgba(255,56,92,.35);
  transition: transform var(--t-fast) var(--spring), background var(--t-fast) var(--ease);
}
.tab-orb:active .orb { transform: scale(.9) rotate(90deg); background: var(--primary-active); }
.tab-orb .orb svg { width: 24px; height: 24px; transform: none !important; }

/* ---------- Modals & sheets ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(0,0,0,.5);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity var(--t-med) var(--ease);
}
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  width: 100%; max-width: 520px; max-height: 88dvh; overflow-y: auto;
  background: var(--canvas);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  padding: 10px 20px calc(24px + env(safe-area-inset-bottom));
  transform: translateY(24px);
  transition: transform var(--t-med) var(--ease);
}
.scrim.open .sheet { transform: none; }
.sheet-grab { width: 40px; height: 4px; border-radius: 2px; background: var(--hairline); margin: 6px auto 14px; }
.sheet h3 { font-family: var(--serif); font-weight: 400; font-size: 24px; letter-spacing: -0.4px; margin-bottom: 4px; }
.sheet .sub { margin-bottom: 14px; }
.form-row { margin-bottom: 14px; }
.form-row label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
input.text, select.text {
  width: 100%; height: 52px; background: #fff;
  border: 1px solid var(--hairline); border-radius: var(--r-sm); padding: 0 14px;
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}

/* Paywall */
.plan-card { border: 1.5px solid var(--hairline); border-radius: var(--r-md); padding: 14px 16px; display: flex; align-items: center; gap: 12px; margin-bottom: 10px; transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease); }
.plan-card.sel { border-color: var(--primary); background: var(--primary-soft); }
.plan-card .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--hairline); flex: 0 0 20px; transition: all var(--t-fast) var(--ease); }

  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .womb-halo { animation: none; }
}

  <script>
/* ============================================================
   Tandem cycle engine — predictions computed from logged
   period days, falling back to user settings.
   Model (standard across popular trackers):
   - cycle length  = interval between period starts (avg of last 6)
   - ovulation     = next predicted start − luteal length (default 14)
   - fertile window = ovulation −5 days … ovulation +1 day
   - PMS window    = 4 days before predicted start
   ============================================================ */

const Cycle = (() => {
  const pad = n => String(n).padStart(2, '0');
  const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (iso, n) => { const d = parse(iso); d.setDate(d.getDate() + n); return toISO(d); };
  const diffDays = (a, b) => Math.round((parse(a) - parse(b)) / 86400000);
  const todayISO = () => toISO(new Date());

  // Group sorted period day strings into consecutive runs
  function runs(periodDays) {
    const days = [...periodDays].sort();
    const out = [];
    for (const d of days) {
      const last = out[out.length - 1];
      if (last && diffDays(d, last.end) === 1) { last.end = d; last.len++; }
      else out.push({ start: d, end: d, len: 1 });
    }
    return out;
  }

  const mean = a => a.reduce((s, v) => s + v, 0) / a.length;

  function stats(periodDays, settings) {
    const rs = runs(periodDays);
    const starts = rs.map(r => r.start);
    const intervals = [];
    for (let i = 1; i < starts.length; i++) {
      const d = diffDays(starts[i], starts[i - 1]);
      if (d >= 15 && d <= 60) intervals.push(d);
    }
    const recent = intervals.slice(-6);
    const recentLens = rs.slice(-6).map(r => r.len).filter(l => l >= 1 && l <= 12);
    const cycleLen = recent.length ? Math.round(mean(recent)) : settings.cycleLen;
    const periodLen = recentLens.length ? Math.round(mean(recentLens)) : settings.periodLen;
    const variability = recent.length > 1
      ? Math.round(Math.max(...recent) - Math.min(...recent))
      : null;
    return { runs: rs, intervals: recent, cycleLen, periodLen, variability, lastStart: starts[starts.length - 1] || null };
  }

  function predictions(periodDays, settings, count = 3) {
    const st = stats(periodDays, settings);
    if (!st.lastStart) return { ...st, cycles: [] };
    const cycles = [];
    for (let k = 1; k <= count; k++) {
      const start = addDays(st.lastStart, st.cycleLen * k);
      const ovulation = addDays(start, -settings.luteal);
      cycles.push({
        start,
        end: addDays(start, st.periodLen - 1),
        ovulation,
        fertileStart: addDays(ovulation, -5),
        fertileEnd: addDays(ovulation, 1),
        pmsStart: addDays(start, -4),
      });
    }
    return { ...st, cycles };
  }

  // Classify one calendar date. Logged period wins over everything.
  function dayInfo(iso, periodDays, settings) {
    const set = periodDays instanceof Set ? periodDays : new Set(periodDays);
    if (set.has(iso)) return { kind: 'period' };
    const pred = predictions(periodDays, settings, 4);
    if (!pred.lastStart) return { kind: 'none' };

    // current (in-progress) cycle fertile window too
    const currentOv = addDays(pred.cycles.length ? pred.cycles[0].start : pred.lastStart, pred.cycles.length ? -settings.luteal : 0);
    const windows = pred.cycles.map(c => c);

    for (const c of windows) {
      if (iso >= c.start && iso <= c.end) return { kind: 'predicted' };
    }
    for (const c of windows) {
      if (iso === c.ovulation) return { kind: 'ovulation' };
      if (iso >= c.fertileStart && iso <= c.fertileEnd) return { kind: 'fertile' };
    }
    for (const c of windows) {
      if (iso >= c.pmsStart && iso < c.start) return { kind: 'pms' };
    }
    void currentOv;
    return { kind: 'none' };
  }

  // Today's headline state for the home screen / partner view
  function current(periodDays, settings) {
    const today = todayISO();
    const pred = predictions(periodDays, settings, 1);
    if (!pred.lastStart) return null;
    const cycleDay = diffDays(today, pred.lastStart) + 1;
    const next = pred.cycles[0];
    const daysToPeriod = next ? diffDays(next.start, today) : null;
    const set = new Set(periodDays);

    let phase, label;
    if (set.has(today)) { phase = 'menstrual'; label = 'Period'; }
    else if (next && today === next.ovulation) { phase = 'ovulation'; label = 'Ovulation day'; }
    else if (next && today >= next.fertileStart && today <= next.fertileEnd) { phase = 'fertile'; label = 'Fertile window'; }
    else if (next && today >= next.pmsStart && today < next.start) { phase = 'pms'; label = 'PMS window'; }
    else if (next && today < next.fertileStart) { phase = 'follicular'; label = 'Follicular phase'; }
    else { phase = 'luteal'; label = 'Luteal phase'; }

    const chance = { menstrual: 'Low', follicular: 'Low to medium', fertile: 'High', ovulation: 'Highest', luteal: 'Low', pms: 'Low' }[phase];

    return { today, cycleDay, phase, label, daysToPeriod, next, cycleLen: pred.cycleLen, periodLen: pred.periodLen, chance };
  }

  return { toISO, parse, addDays, diffDays, todayISO, runs, stats, predictions, dayInfo, current };
})();

  </script>
  <script>
/* ============================================================
   Tandem store — localStorage persistence + defaults
   ============================================================ */

const Store = (() => {
  const KEY = 'tandem.v1';

  const defaults = () => ({
    onboarded: false,
    premium: false,
    trialEndsAt: null,
    role: 'tracker', // 'tracker' | 'partner'
    linked: false,
    inviteCode: null,
    names: { tracker: '', partner: '' },
    settings: { cycleLen: 28, periodLen: 5, luteal: 14, reduceMotion: false, goal: 'track' }, // goal: track | ttc | avoid
    periodDays: [],        // ['YYYY-MM-DD', ...]
    logs: {},              // { iso: { flow, symptoms[], moods[], sex, energy, water, sleep, bbt, notes } }
    notes: [],             // love notes: { from: 'tracker'|'partner', text, at }
  });

  let data = defaults();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) data = Object.assign(defaults(), JSON.parse(raw));
    } catch (e) { /* corrupted state — start fresh */ data = defaults(); }
    return data;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* storage full/blocked */ }
  }

  function patch(fn) { fn(data); save(); }

  function reset() { data = defaults(); save(); }

  function get() { return data; }

  function togglePeriodDay(iso) {
    patch(d => {
      const i = d.periodDays.indexOf(iso);
      if (i >= 0) d.periodDays.splice(i, 1);
      else d.periodDays.push(iso);
      d.periodDays.sort();
    });
  }

  function log(iso) {
    if (!data.logs[iso]) data.logs[iso] = { flow: null, symptoms: [], moods: [], sex: null, energy: null, water: 0, sleep: null, bbt: null, notes: '' };
    return data.logs[iso];
  }

  function sampleData() {
    // Three realistic past cycles ending recently, plus a few logs
    const today = Cycle.todayISO();
    const starts = [Cycle.addDays(today, -66), Cycle.addDays(today, -37), Cycle.addDays(today, -9)];
    const lens = [5, 6, 5];
    const periodDays = [];
    starts.forEach((s, i) => { for (let k = 0; k < lens[i]; k++) periodDays.push(Cycle.addDays(s, k)); });
    const logs = {};
    const put = (iso, o) => { logs[iso] = Object.assign({ flow: null, symptoms: [], moods: [], sex: null, energy: null, water: 0, sleep: null, bbt: null, notes: '' }, o); };
    put(starts[2], { flow: 'Heavy', symptoms: ['Cramps', 'Fatigue'], moods: ['Sensitive'], water: 5, sleep: 7 });
    put(Cycle.addDays(starts[2], 1), { flow: 'Heavy', symptoms: ['Cramps', 'Backache'], moods: ['Irritable'], water: 6, sleep: 6.5 });
    put(Cycle.addDays(starts[2], 2), { flow: 'Medium', symptoms: ['Headache'], moods: ['Calm'], water: 7, sleep: 8 });
    put(Cycle.addDays(starts[2], 3), { flow: 'Light', symptoms: [], moods: ['Happy'], water: 6, sleep: 8 });
    put(Cycle.addDays(starts[2], 4), { flow: 'Spotting', symptoms: [], moods: ['Energetic'], water: 8, sleep: 7.5 });
    put(Cycle.addDays(starts[1], 0), { flow: 'Medium', symptoms: ['Cramps', 'Bloating'], moods: ['Sad'], water: 4, sleep: 6 });
    put(Cycle.addDays(starts[1], 26), { symptoms: ['Tender breasts', 'Cravings'], moods: ['Irritable'], water: 5, sleep: 6 });
    put(Cycle.addDays(starts[1], 25), { symptoms: ['Bloating', 'Cravings'], moods: ['Anxious'], water: 4, sleep: 6.5 });
    put(Cycle.addDays(today, -1), { symptoms: [], moods: ['Romantic'], sex: 'Protected', water: 7, sleep: 8 });

    patch(d => {
      d.periodDays = periodDays.sort();
      d.logs = logs;
      d.notes = [
        { from: 'partner', text: 'Picked up your favorite tea on the way home 🍵', at: Date.now() - 86400000 * 2 },
        { from: 'tracker', text: 'You’re the best. Movie night?', at: Date.now() - 86400000 * 2 + 3600000 },
        { from: 'partner', text: 'Always. You pick, I’ll make popcorn 🍿', at: Date.now() - 86400000 },
      ];
      d.linked = true;
      d.inviteCode = 'LUNA-7439';
    });
  }

  return { load, save, patch, reset, get, togglePeriodDay, log, sampleData, KEY };
})();

  <script>
/* ============================================================
   Tandem sprite engine
   Generates a full 8×8 (64-frame) spritesheet of an animated
   "womb-heart" — a heart shaped like a womb with fallopian
   arms, ovaries, inner lining, glow and orbiting sparkles —
   entirely in code on an offscreen canvas, then plays it back
   frame-by-frame like a classic spritesheet animation.

   Motion practices applied:
   - all easing baked per-frame (double-pulse heartbeat curve)
   - playback via requestAnimationFrame, time-based (no drift)
   - honors prefers-reduced-motion (renders a single calm frame)
   - only canvas compositing at play time; zero layout work
   ============================================================ */

const WombSprite = (() => {
  const COLS = 8, ROWS = 8, FRAMES = COLS * ROWS, CELL = 200;

  // Phase palettes: body stays womb-pink, accents shift per phase
  const PALETTES = {
    menstrual:  { light: '#ff8fa9', mid: '#ff385c', deep: '#c81e48', glow: '#ff5c7c', spark: '#ffd1da', bpm: 0.9 },
    follicular: { light: '#ffa3b8', mid: '#ff5c7c', deep: '#d42a52', glow: '#ff8fa9', spark: '#e8a55a', bpm: 1.0 },
    fertile:    { light: '#ffb0c0', mid: '#ff5c7c', deep: '#d42a52', glow: '#5db8a6', spark: '#5db8a6', bpm: 1.15 },
    ovulation:  { light: '#ffc2ce', mid: '#ff6b8a', deep: '#d42a52', glow: '#5db8a6', spark: '#8fe0cf', bpm: 1.3 },
    luteal:     { light: '#f2a98f', mid: '#e0705c', deep: '#b04a38', glow: '#cc785c', spark: '#e8a55a', bpm: 0.95 },
    pms:        { light: '#f0b283', mid: '#e08a5c', deep: '#b05f38', glow: '#e8a55a', spark: '#e8a55a', bpm: 0.85 },
  };

  // Double-pulse heartbeat envelope: lub–dub, then rest
  function beat(t) {
    const g = (c, w) => Math.exp(-Math.pow((t - c) / w, 2));
    return g(0.16, 0.055) + 0.55 * g(0.34, 0.075);
  }

  function heartPath(ctx, s) {
    // Womb-shaped heart: rounder top lobes, gently tapered base
    ctx.beginPath();
    ctx.moveTo(0, 30 * s);
    ctx.bezierCurveTo(-58 * s, -12 * s, -38 * s, -52 * s, -2 * s, -26 * s);
    ctx.bezierCurveTo(0, -28 * s, 0, -28 * s, 2 * s, -26 * s);
    ctx.bezierCurveTo(38 * s, -52 * s, 58 * s, -12 * s, 0, 30 * s);
    ctx.closePath();
  }

  function drawArm(ctx, dir, p, wiggle) {
    // Fallopian arm: curl out from the top notch, ovary at the tip
    ctx.save();
    ctx.scale(dir, 1);
    ctx.strokeStyle = p.deep;
    ctx.lineWidth = 6.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(14, -34);
    ctx.bezierCurveTo(34, -58 + wiggle * 2, 58, -56 + wiggle * 3, 66, -38 + wiggle * 2);
    ctx.stroke();
    // fimbriae — little fingers at the tube end
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.lineWidth = 2.6;
      ctx.moveTo(66, -38 + wiggle * 2);
      ctx.quadraticCurveTo(72 + i * 2, -32 + i * 5 + wiggle, 76 + i * 2.5, -28 + i * 7 + wiggle);
      ctx.stroke();
    }
    // ovary
    const og = ctx.createRadialGradient(70, -50 + wiggle * 2, 1, 70, -50 + wiggle * 2, 11);
    og.addColorStop(0, p.light);
    og.addColorStop(1, p.mid);
    ctx.fillStyle = og;
    ctx.beginPath();
    ctx.arc(70, -50 + wiggle * 2, 10, 0, Math.PI * 2);
    ctx.fill();
    // follicle dots
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    [[66, -53], [73, -49], [69, -45]].forEach(([x, y]) => {
      ctx.beginPath(); ctx.arc(x, y + wiggle * 2, 1.7, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
  }

  function drawSparkle(ctx, x, y, r, alpha, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-r, 0); ctx.lineTo(r, 0);
    ctx.moveTo(0, -r); ctx.lineTo(0, r);
    ctx.stroke();
    ctx.restore();
  }

  function drawFrame(ctx, t, p) {
    const b = beat(t);
    const scale = 1 + 0.065 * b;
    const glow = 0.30 + 0.42 * b;
    const wiggle = Math.sin(t * Math.PI * 2) * 1.6;

    ctx.save();
    ctx.translate(CELL / 2, CELL / 2 + 8);

    // expanding pulse ring, emitted on each beat loop
    const ringT = (t + 0.7) % 1;
    ctx.beginPath();
    ctx.arc(0, -4, 52 + ringT * 44, 0, Math.PI * 2);
    ctx.strokeStyle = p.glow;
    ctx.globalAlpha = (1 - ringT) * 0.22;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 1;

    // ambient glow
    const gg = ctx.createRadialGradient(0, -4, 6, 0, -4, 86);
    gg.addColorStop(0, p.glow + 'aa');
    gg.addColorStop(1, p.glow + '00');
    ctx.globalAlpha = glow;
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(0, -4, 86, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    // arms behind body
    drawArm(ctx, -1, p, wiggle);
    drawArm(ctx, 1, p, -wiggle);

    // beating body
    ctx.save();
    ctx.scale(scale, scale);

    const bg = ctx.createLinearGradient(0, -55, 0, 55);
    bg.addColorStop(0, p.light);
    bg.addColorStop(0.45, p.mid);
    bg.addColorStop(1, p.deep);
    heartPath(ctx, 1.5);
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = p.deep;
    ctx.globalAlpha = 0.5;
    ctx.stroke();
    ctx.globalAlpha = 1;

    // inner lining (endometrium) — softly pulsing inner heart
    ctx.save();
    ctx.scale(0.58 + 0.03 * b, 0.58 + 0.03 * b);
    const ig = ctx.createRadialGradient(0, -6, 2, 0, -6, 60);
    ig.addColorStop(0, p.deep);
    ig.addColorStop(1, p.mid + '00');
    heartPath(ctx, 1.5);
    ctx.fillStyle = ig;
    ctx.globalAlpha = 0.65;
    ctx.fill();
    ctx.restore();

    // cervical dimple
    ctx.beginPath();
    ctx.arc(0, 34, 3.4, 0, Math.PI * 2);
    ctx.fillStyle = p.deep;
    ctx.globalAlpha = 0.55;
    ctx.fill();
    ctx.globalAlpha = 1;

    // gloss highlight
    ctx.beginPath();
    ctx.ellipse(-20, -28, 15, 9, -0.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.38)';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(-30, -14, 5, 3.2, -0.6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.30)';
    ctx.fill();
    ctx.restore();

    // orbiting sparkles
    for (let i = 0; i < 7; i++) {
      const a = t * Math.PI * 2 + (i * Math.PI * 2) / 7;
      const rad = 84 + 9 * Math.sin(t * Math.PI * 4 + i * 1.7);
      const tw = Math.sin(t * Math.PI * 6 + i * 2.3);
      drawSparkle(
        ctx,
        Math.cos(a) * rad,
        -4 + Math.sin(a) * rad * 0.82,
        2 + 1.6 * Math.abs(tw),
        0.18 + 0.4 * Math.abs(tw),
        i % 3 === 0 ? '#ffffff' : p.spark
      );
    }

    ctx.restore();
  }

  function generateSheet(phase) {
    const p = PALETTES[phase] || PALETTES.follicular;
    const c = document.createElement('canvas');
    c.width = COLS * CELL;
    c.height = ROWS * CELL;
    const ctx = c.getContext('2d');
    for (let f = 0; f < FRAMES; f++) {
      const x = (f % COLS) * CELL, y = Math.floor(f / COLS) * CELL;
      ctx.save();
      ctx.translate(x, y);
      ctx.beginPath();
      ctx.rect(0, 0, CELL, CELL);
      ctx.clip();
      drawFrame(ctx, f / FRAMES, p);
      ctx.restore();
    }
    return c;
  }

  // ---------- Player ----------
  let sheet = null, currentPhase = null, rafId = 0, playing = false;
  let displayCanvas = null, dctx = null;

  function reducedMotion() {
    return document.body.classList.contains('reduce-motion') ||
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function blit(frame) {
    const size = displayCanvas.width;
    const sx = (frame % COLS) * CELL, sy = Math.floor(frame / COLS) * CELL;
    dctx.clearRect(0, 0, size, size);
    dctx.drawImage(sheet, sx, sy, CELL, CELL, 0, 0, size, size);
  }

  function loop() {
    const p = PALETTES[currentPhase] || PALETTES.follicular;
    const periodMs = 2400 / p.bpm; // one heartbeat loop
    const step = (now) => {
      if (!playing) return;
      const frame = Math.floor(((now % periodMs) / periodMs) * FRAMES) % FRAMES;
      blit(frame);
      rafId = requestAnimationFrame(step);
    };
    rafId = requestAnimationFrame(step);
  }

  function mount(canvas) {
    displayCanvas = canvas;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cssSize = canvas.clientWidth || 264;
    canvas.width = Math.round(cssSize * dpr);
    canvas.height = Math.round(cssSize * dpr);
    dctx = canvas.getContext('2d');
  }

  function setPhase(phase) {
    if (!displayCanvas) return;
    if (phase !== currentPhase || !sheet) {
      currentPhase = phase;
      sheet = generateSheet(phase);
    }
    cancelAnimationFrame(rafId);
    if (reducedMotion()) {
      playing = false;
      blit(0); // calm resting frame
    } else {
      playing = true;
      loop();
    }
  }

  function stop() { playing = false; cancelAnimationFrame(rafId); }

  function getSheetDataURL(phase) {
    return generateSheet(phase || currentPhase || 'follicular').toDataURL('image/png');
  }

  // tiny generated favicon: a single small womb-heart frame
  function favicon() {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    const ctx = c.getContext('2d');
    ctx.save();
    ctx.translate(-CELL / 2 * 0.32 + 32, -CELL / 2 * 0.32 + 30 - 3);
    ctx.scale(0.32, 0.32);
    drawFrame(ctx, 0.16, PALETTES.menstrual);
    ctx.restore();
    return c.toDataURL('image/png');
  }

  return { mount, setPhase, stop, getSheetDataURL, favicon, PALETTES };
})();

  // ---------------- INSIGHTS ----------------
  function renderInsights() {
    const st = Cycle.stats(D.periodDays, D.settings);
    const pred = Cycle.predictions(D.periodDays, D.settings, 3);
    const rs = st.runs;

    // bar chart of last cycles
    let bars = '<p class="sub">Log at least two periods to see cycle history.</p>';
    if (st.intervals.length) {
      const max = Math.max(...st.intervals, 35);
      bars = `<div class="chart-wrap"><div class="bar-chart">` + st.intervals.map((v, i) => {
        const startIso = rs[rs.length - st.intervals.length - 1 + i]?.start || '';
        return `<div class="bar-col" style="--i:${i}">
          <span class="v">${v}</span>
          <div class="bar" style="height:${Math.round((v / max) * 82) + 8}px"></div>
          <span class="d">${startIso ? fmtDate(startIso) : ''}</span>
        </div>`;
      }).join('') + `</div></div>`;
    }

    // premium: symptom frequency by phase
    const freq = {};
    Object.entries(D.logs).forEach(([iso, l]) => (l.symptoms || []).forEach(s => { freq[s] = (freq[s] || 0) + 1; void iso; }));
    const top = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 6);

    const cur = Cycle.current(D.periodDays, D.settings);

  function exportReport() {
    const st = Cycle.stats(D.periodDays, D.settings);
    const pred = Cycle.predictions(D.periodDays, D.settings, 2);
    const lines = [
      'TANDEM — CYCLE HEALTH REPORT',

      ...st.runs.map(r => `  ${r.start} → ${r.end}  (${r.len} days)`),
      '',

      ...pred.cycles.map(c => `  Period ~${c.start}, ovulation ~${c.ovulation}, fertile ${c.fertileStart}–${c.fertileEnd}`),

      ...Object.entries(D.logs).sort().map(([iso, l]) =>
        `  ${iso}: ${[l.flow && 'flow ' + l.flow, l.symptoms.length && 'symptoms: ' + l.symptoms.join(', '), l.moods.length && 'mood: ' + l.moods.join(', '), l.bbt != null && 'BBT ' + l.bbt + '°C'].filter(Boolean).join(' · ') || '—'}`),

  function download(name, content, mime) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([content], { type: mime }));
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  // ---------------- global event delegation ----------------
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-tab],[data-action],[data-day],[data-logdate],[data-chip],[data-role],[data-plan]');
    if (!t) return;

    if (t.dataset.tab) { switchTab(t.dataset.tab); return; }
    if (t.dataset.logdate) { logDate = t.dataset.logdate; renderLog(); return; }
    if (t.dataset.day && !t.dataset.action) { openDaySheet(t.dataset.day); return; }
    if (t.dataset.role) { Store.patch(d => d.role = t.dataset.role); D = Store.get(); renderPartner(); return; }
    if (t.dataset.plan) { selectedPlan = t.dataset.plan; renderPaywall(); return; }

    if (t.dataset.chip) {
      const { chip, val } = t.dataset;
      mutateLog(l => {
        if (chip === 'flow') l.flow = l.flow === val ? null : val;
        else if (chip === 'sex') l.sex = l.sex === val ? null : val;
        else if (chip === 'symptom') l.symptoms = l.symptoms.includes(val) ? l.symptoms.filter(x => x !== val) : [...l.symptoms, val];
        else if (chip === 'mood') l.moods = l.moods.includes(val) ? l.moods.filter(x => x !== val) : [...l.moods, val];
      });
      return;
    }

    switch (t.dataset.action) {
      case 'open-settings': renderSettings(); break;
      case 'paywall': renderPaywall(); break;
      case 'close-sheet': closeAllSheets(); break;

      case 'quick-period': {
        Store.togglePeriodDay(Cycle.todayISO());
        D = Store.get();
        rerender();
        toast(new Set(D.periodDays).has(Cycle.todayISO()) ? 'Period logged for today 🌹' : 'Removed today’s period mark');
        break;
      }
      case 'goto-log': switchTab('log'); break;
      case 'goto-calendar': switchTab('calendar'); break;

      case 'cal-prev': calCursor.setMonth(calCursor.getMonth() - 1); renderCalendar(); break;
      case 'cal-next': calCursor.setMonth(calCursor.getMonth() + 1); renderCalendar(); break;
      case 'toggle-period': {
        Store.togglePeriodDay(t.dataset.day);
        D = Store.get();
        closeAllSheets();
        renderCalendar();
        toast('Calendar updated');
        break;
      }
      case 'open-log-day': logDate = t.dataset.day; closeAllSheets(); switchTab('log'); break;

      case 'water': mutateLog(l => l.water = Math.max(0, (l.water || 0) + Number(t.dataset.d))); break;
      case 'sleep': mutateLog(l => l.sleep = Math.max(0, Math.round(((l.sleep == null ? 7 : l.sleep) + Number(t.dataset.d)) * 2) / 2)); break;
      case 'bbt': mutateLog(l => l.bbt = Math.round(((l.bbt == null ? 36.5 : l.bbt) + Number(t.dataset.d)) * 100) / 100); break;
      case 'save-notes': mutateLog(l => l.notes = $('#log-notes').value); toast('Log saved 💾'); break;

      case 'export-report': exportReport(); break;
      case 'export-json': download('tandem-data.json', JSON.stringify(Store.get(), null, 2), 'application/json'); toast('Data exported'); break;

      case 'copy-code': {
        const code = D.inviteCode || '';
        (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(
          () => toast('Code copied — send it to your person 💌'),
          () => toast('Code: ' + code)
        );
        break;
      }
      case 'simulate-link': Store.patch(d => d.linked = true); D = Store.get(); renderPartner(); toast('Linked! You’re in tandem now 💞'); break;
      case 'send-note': {
        const input = $('#note-input');
        const text = input.value.trim();
        if (!text) break;
        Store.patch(d => d.notes.push({ from: d.role, text, at: Date.now() }));
        D = Store.get();
        renderPartner();
        toast('Note sent 💌');
        break;
      }

      case 'start-trial': {
        Store.patch(d => { d.premium = true; d.trialEndsAt = Date.now() + 7 * 86400000; });
        D = Store.get();
        closeAllSheets();
        rerender();
        toast('Welcome to Tandem Plus ✦ trial started');
        break;
      }
      case 'cancel-plus': Store.patch(d => { d.premium = false; d.trialEndsAt = null; }); D = Store.get(); closeAllSheets(); rerender(); toast('Plus canceled'); break;

      case 'save-settings': {
        Store.patch(d => {
          d.names.tracker = $('#set-name').value.trim();
          d.names.partner = $('#set-pname').value.trim();
          d.settings.goal = $('#set-goal').value;
          d.settings.cycleLen = Math.min(60, Math.max(15, parseInt($('#set-cycle').value, 10) || 28));
          d.settings.periodLen = Math.min(12, Math.max(1, parseInt($('#set-period').value, 10) || 5));
          d.settings.luteal = Math.min(17, Math.max(9, parseInt($('#set-luteal').value, 10) || 14));
          d.settings.reduceMotion = $('#set-motion').checked;
        });
        D = Store.get();
        applyMotionPref();
        closeAllSheets();
        rerender();
        toast('Settings saved');
        break;
      }
      case 'view-sheet': {
        const cur = Cycle.current(D.periodDays, D.settings);
        $('#sheet-view').innerHTML = `
          <h3>Generated spritesheet</h3>
          <p class="sub">64 frames, drawn entirely in code at load time — this exact sheet powers the beating womb-heart on Home.</p>
          <img alt="8 by 8 spritesheet of the womb heart animation" src="${WombSprite.getSheetDataURL(cur ? cur.phase : 'follicular')}">
        `;
        closeSheet('settings');
        openSheet('sheetviewer');
        break;
      }
      case 'load-sample': Store.sampleData(); Store.patch(d => { d.names.tracker = d.names.tracker || 'Maya'; d.names.partner = d.names.partner || 'Sam'; }); D = Store.get(); closeAllSheets(); rerender(); toast('Sample data loaded'); break;
      case 'erase': {
        if (confirm('Erase all Tandem data on this device?')) {
          Store.reset(); D = Store.get(); closeAllSheets(); renderOnboarding();
        }
        break;
      }
      case 'finish-onboarding': finishOnboarding(false); break;
      case 'onboard-sample': finishOnboarding(true); break;
    }
  });

  // close sheets when tapping the scrim itself
  $$('.scrim').forEach(s => s.addEventListener('click', e => { if (e.target === s) s.classList.remove('open'); }));

  // ---------------- boot ----------------
  function boot() {
    D = Store.load();
    applyMotionPref();
    // generated favicon
    const link = document.createElement('link');
    link.rel = 'icon';
    link.href = WombSprite.favicon();
    document.head.appendChild(link);

    switchTab('home');
    if (!D.onboarded) renderOnboarding();
  }

  boot();
})();

  </script>
</body>
</html>
